# Build BUNDLE prebuilt: Skia + SDL3 + Yoga + QuickJS (Android per-ABI)
#
# Skia via NDK (build_android.py), SDL3 dari aar resmi (.so per ABI + JNI +
# Java bindings), Yoga di-cross-compile per ABI (script/build_yoga_android.py),
# QuickJS amalgam + header. Hasil: SATU arsip .tar.gz dipublikasikan ke Releases.
name: Build Bundle Android (Skia+SDL3+Yoga+QuickJS)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bundle-android.yml'
      - 'script/**'
      - 'third_party/versions.json'
  workflow_dispatch:
    inputs:
      skia_version:
        description: "Versi Skia"
        required: false
        default: "chrome/m158"
        type: string
      build_type:
        description: "Tipe build"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      abis:
        description: "ABI Android (pisahkan dengan koma)"
        required: false
        default: "arm64-v8a,armeabi-v7a,x86_64"
        type: choice
        options:
          - "arm64-v8a,armeabi-v7a,x86_64"
          - "arm64-v8a"
          - "arm64-v8a,armeabi-v7a"
          - "x86_64"

env:
  SKIA_VERSION: ${{ github.event.inputs.skia_version || 'chrome/m158' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
  ANDROID_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a,armeabi-v7a,x86_64' }}
  DEPOT_TOOLS_UPDATE: "0"

jobs:
  android:
    name: Bundle Android (${{ github.event.inputs.build_type || 'Release' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl unzip zip python3 cmake ninja-build gcc g++

      - name: Checkout Skia (script/checkout.py)
        run: python3 script/checkout.py --version "$SKIA_VERSION"

      - name: Download Android NDK (script/download_ndk.py)
        run: python3 script/download_ndk.py

      - name: Build Skia for Android (script/build_android.py)
        run: python3 script/build_android.py --build-type "$BUILD_TYPE" --abis "$ANDROID_ABIS"

      - name: Fetch SDL3 aar + headers, QuickJS (script/fetch_deps.py)
        env:
          SKIA_TARGET_OS: android
        run: python3 script/fetch_deps.py --system linux --out-subdir android

      - name: Cross-build Yoga per ABI (script/build_yoga_android.py)
        run: python3 script/build_yoga_android.py

      - name: Archive bundle (script/archive_bundle.py)
        env:
          SKIA_TARGET_OS: android
        run: python3 script/archive_bundle.py --version "$SKIA_VERSION" --build-type "$BUILD_TYPE" --abis "$ANDROID_ABIS"

      - name: Compute safe artifact name
        run: |
          echo "ARTIFACT_NAME=prana-libs-android" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "prana-libs-android.tar.gz"
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'prana-libs-android*'
          merge-multiple: true
          path: dist

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prana-libs-${{ env.SKIA_VERSION }}
          name: "prana-libs — Skia+SDL3+Yoga+QuickJS (${{ env.SKIA_VERSION }})"
          body: |
            Prebuilt development bundle **Android**: Skia per-ABI (arm64-v8a,
            armeabi-v7a, x86_64) + SDL3 (aar: libSDL3.so per ABI + Java/JNI) +
            Yoga per-ABI + header & amalgam QuickJS. Detail versi: `versions.json`.
          files: dist/*
          draft: false
          prerelease: false
          makeid: false
          fail_on_unmatched_files: true
