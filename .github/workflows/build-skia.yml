# Build Skia — gaya JetBrains/skia-build (updated)
#
# Mengadopsi pendekatan https://github.com/JetBrains/skia-build:
#   - git clone skia langsung (tanpa `fetch`/gclient DEPS yang rewel)
#   - semua dependency di-bundle dari third_party/externals (system libs OFF)
#     -> tidak ada konflik header dengan runner (penyebab "4 errors generated")
#   - gn args + patch JetBrains, namun sudah di-update untuk Skia modern:
#       * python3 (Skia tak lagi butuh python2 untuk git-sync-deps)
#       * g++ default runner (g++-9 tak ada di ubuntu-24.04)
#       * is_official_build=false (hindari -fuse-ld=gold & error partition_alloc)
name: Build Skia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-skia.yml'
      - 'script/**'
      - 'patches/**'
  workflow_dispatch:
    inputs:
      skia_version:
        description: "Versi Skia: main | chrome/mNNN (mis. chrome/m158) | mNNN-sha | commit hash"
        required: false
        default: "chrome/m158"
        type: string
      build_type:
        description: "Tipe build"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

env:
  SKIA_VERSION: ${{ github.event.inputs.skia_version || 'chrome/m158' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
  DEPOT_TOOLS_UPDATE: "0"

jobs:
  linux:
    name: Linux (${{ github.event.inputs.build_type || 'Release' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo (script + patches)
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl unzip zip python3 pkg-config ninja-build gcc g++ \
            libfontconfig1-dev libglu1-mesa-dev

      - name: Checkout Skia (script/checkout.py)
        run: python3 script/checkout.py --version "$SKIA_VERSION"

      - name: Build Skia (script/build.py)
        run: python3 script/build.py --build-type "$BUILD_TYPE"

      - name: Archive (script/archive.py)
        run: python3 script/archive.py --version "$SKIA_VERSION" --build-type "$BUILD_TYPE"

      - name: Compute safe artifact name
        run: |
          SAFE_NAME=$(python3 -c 'import re,sys; print(re.sub(r"[^A-Za-z0-9._+-]", "_", sys.argv[1]))' "Skia-${SKIA_VERSION}-linux-${BUILD_TYPE}-x64")
          echo "ARTIFACT_NAME=${SAFE_NAME}" >> "$GITHUB_ENV"
          echo "Artifact name: ${SAFE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.zip"
          retention-days: 14

  # Publikasikan ZIP ke halaman Releases agar bisa diunduh publik tanpa login.
  release:
    name: Publish to GitHub Releases
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'Skia-*linux*'
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -la dist/

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skia-${{ env.SKIA_VERSION }}
          name: "Skia ${{ env.SKIA_VERSION }} binaries"
          body: |
            Prebuilt static binaries of Skia (${{ env.SKIA_VERSION }}), rebuilt automatically by GitHub Actions.

            | Platform | Arsitektur | Isi |
            |---|---|---|
            | Linux | x64 | `libskia.a` + headers (GCC/Clang) |
            | Android | arm64-v8a, armeabi-v7a, x86_64 | `libskia.a` per ABI + headers (NDK) |
            | Windows | x64 | `skia.lib` + headers (MSVC) |

            Setiap ZIP berisi library statis, `icudtl.dat`, dan seluruh header
            (`include/`, `src/**/*.h`, modul, third_party bundled) sehingga siap
            dipakai compile.

            Unduh langsung (tanpa login): klik aset di bawah, atau gunakan URL
            `https://github.com/tbahmad/skia-build/releases/download/<tag>/<file>.zip`.
          files: dist/*
          draft: false
          prerelease: false
          makeid: false
          fail_on_unmatched_files: true
