# Build BUNDLE prebuilt: Skia + SDL3 + Yoga + QuickJS (Windows x64, MSVC)
#
# SDL3 memakai release resmi VC++ (SDL3.lib + SDL3.dll), Yoga via CMake/MSVC,
# QuickJS amalgam + libquickjs.a (cl/lib). Hasil: satu arsip .tar.gz ke Releases.
name: Build Bundle Windows (Skia+SDL3+Yoga+QuickJS)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bundle-windows.yml'
      - 'script/**'
      - 'third_party/versions.json'
  workflow_dispatch:
    inputs:
      skia_version:
        description: "Versi Skia: main | chrome/mNNN (mis. chrome/m158)"
        required: false
        default: "chrome/m158"
        type: string
      build_type:
        description: "Tipe build"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

env:
  SKIA_VERSION: ${{ github.event.inputs.skia_version || 'chrome/m158' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
  DEPOT_TOOLS_UPDATE: "0"

jobs:
  windows:
    name: Bundle Windows x64 (${{ github.event.inputs.build_type || 'Release' }})
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -el {0}   # login shell agar env MSVC (vcvars) bertahan antar step
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Add MSVC to PATH (vswhere + vcvars64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere tidak ditemukan di $vswhere" }
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Write-Host "Visual Studio di: $vsPath"
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >NUL 2>&1 && set" | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH|VSCMD_ARG_TGT_ARCH)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          cl 2>&1 | Select-Object -First 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ninja + gn (GitHub/CIPD release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = "$env:GITHUB_WORKSPACE\ci-tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip' `
            -OutFile "$env:RUNNER_TEMP\ninja.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ninja.zip" -DestinationPath $tools -Force
          try {
            Invoke-WebRequest -Uri 'https://chrome-infra-packages.appspot.com/dl/gn/gn/windows-amd64/+/latest' `
              -OutFile "$env:RUNNER_TEMP\gn.zip" -UserAgent 'curl/8'
            Expand-Archive -Path "$env:RUNNER_TEMP\gn.zip" -DestinationPath $tools -Force
          } catch { Write-Host "WARNING: unduh gn gagal ($_.) - checkout.py akan mencoba lagi." }
          "$tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Checkout Skia (script/checkout.py)
        run: python script/checkout.py --version "$SKIA_VERSION"

      - name: Build Skia (script/build.py)
        run: python script/build.py --build-type "$BUILD_TYPE"

      - name: Fetch SDL3(VC) + Yoga(CMake) + QuickJS (script/fetch_deps.py)
        run: python script/fetch_deps.py

      - name: Archive bundle (script/archive_bundle.py)
        run: python script/archive_bundle.py --version "$SKIA_VERSION" --build-type "$BUILD_TYPE"

      - name: Compute safe artifact name
        run: |
          SAFE_NAME=$(python -c 'import re,sys; print(re.sub(r"[^A-Za-z0-9._+-]", "_", sys.argv[1]))' "SkiaBundle-${SKIA_VERSION}-windows-${BUILD_TYPE}")
          echo "ARTIFACT_NAME=${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "SkiaBundle-*.tar.gz"
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'SkiaBundle-*windows*'
          merge-multiple: true
          path: dist

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bundle-${{ env.SKIA_VERSION }}
          name: "Skia+SDL3+Yoga+QuickJS bundle (${{ env.SKIA_VERSION }})"
          body: |
            Prebuilt development bundle untuk **Windows x64 (MSVC)**: Skia + SDL3
            (SDL3.lib + SDL3.dll) + Yoga + QuickJS (libquickjs.a + qjs/qjsc.exe).
            Detail versi: lihat `versions.json` di dalam arsip.
          files: dist/*
          draft: false
          prerelease: false
          makeid: false
          fail_on_unmatched_files: true
